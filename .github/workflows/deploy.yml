name: Deploy dashboard to GitHub Pages

# Publishes the *upload build* — the app with no ticket data in it. Users load
# their own TM-*.xlsx through the Data panel and it is parsed in their browser,
# so nothing sensitive is ever committed or served from here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5
        id: pages

      # build:static runs vite build and then strips dist/data. It never runs
      # build:data, so the workbooks are not needed here — which is exactly why
      # this can build in CI at all.
      # VITE_ASSISTANT_URL points the assistant at a proxy that holds the OpenAI
      # key, so users are never asked for one. Left unset, the assistant falls back
      # to each user supplying their own. It is a variable, not a secret — it is a
      # public URL, and the key itself never leaves the proxy.
      - run: npm run build:static
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
          VITE_ASSISTANT_URL: ${{ vars.VITE_ASSISTANT_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
