<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEMMP Service Dashboard</title>

    <!--
      The tab mark. Three files rather than one, and the order is deliberate:
      `.ico` is declared first so a browser that ignores `type` takes it, and the
      SVG second so every modern one overrides with the crisp copy. Only the
      artwork lives in `public/` — the in-app logo is `Logo.jsx` and is a
      different drawing for a different size; neither is generated from the other.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Space Grotesk, with the system sans as fallback. `display=swap` means text
      paints immediately in the fallback and reflows when the font lands, so an
      office machine with no internet still shows a readable dashboard rather than
      a blank one.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <!--
      Stamp the theme before the first paint, from the same key ThemeToggle
      writes. Doing it here rather than in a `prefers-color-scheme` block is what
      lets the stylesheet carry one dark palette instead of two: a duplicated
      token list silently drifts the moment either copy is edited alone.
      It also removes the flash of the light theme on a dark machine.
    -->
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('bemmp-theme'); } catch (e) { /* private mode */ }
        var dark = stored === 'dark' || (stored !== 'light'
          && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
