# Netlify deploys the upload build straight from this repository, with the
# assistant proxy running beside it as a function. Set OPENAI_API_KEY in
# Site configuration -> Environment variables; it stays in the function's
# environment and never reaches the browser or the repo.

[build]
  command = "npm run build:static"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Vite content-hashes everything under /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html keeps its name across builds; caching it would pin returning
# browsers to a build whose hashed assets no longer exist.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
